<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131722" media="(prefers-color-scheme: dark)">
<title>股市雷達</title>
<link rel="apple-touch-icon" href="/radar/icon.png">
<link rel="icon" type="image/png" href="/radar/icon.png">
<meta name="apple-mobile-web-app-title" content="股市雷達">

<style>
/* Layout: watchlist-first like a trading app — flat full-width rows (score ring · name · sparkline · price/chg pill),
   underline tabs, details in a bottom sheet. System UI font with tabular numbers. */
:root{
  --bg:#ffffff; --bg2:#f8f9fd; --ink:#131722; --muted:#787b86; --line:#e0e3eb; --hover:#f0f3fa;
  --accent:#2962ff; --accent-soft:#e3ebff;
  --up:#f23645; --down:#089981; --flat:#787b86;
  --strong:#2962ff; --mid:#d99511; --weak:#9598a1; --scrim:rgba(19,23,34,.45);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131722; --bg2:#1e222d; --ink:#d1d4dc; --muted:#787b86; --line:#2a2e39; --hover:#1e222d;
  --accent:#4c7dff; --accent-soft:#1c2846; --up:#f7525f; --down:#22ab94; --strong:#5b8cff; --mid:#f0b43a; --weak:#6a6d78;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.wrap{max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;height:48px}
.bar h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap}
.bar .time{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;margin-right:2px}
.icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--hover)}
.icon svg{width:18px;height:18px}
.icon.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:8px;z-index:30;white-space:nowrap}
.ticker{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;font-size:13px}
.ticker::-webkit-scrollbar{display:none}
.ticker .t{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.ticker .t b{font-weight:600}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:10px 0 9px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs .n{font-size:12px;margin-left:4px;color:var(--muted)}

/* list controls */
.ctrl{display:flex;align-items:center;gap:8px;height:44px}
.filter{display:flex;gap:4px}
.filter button{padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--bg2);color:var(--ink);font-weight:600}
.sort{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.sort select{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:4px 2px;cursor:pointer}

/* section header */
.sec{display:flex;align-items:center;gap:6px;width:100%;padding:14px 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line)}
.sec .chev{transition:transform .15s;display:inline-block}
.sec[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.sec .cnt{font-weight:400}
.sec .hint{margin-left:auto;font-weight:400;letter-spacing:0}

/* rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 64px 92px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:hover{background:var(--hover)}
.ring{width:36px;height:36px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:3}
.ring .fg{fill:none;stroke:var(--weak);stroke-width:3;stroke-linecap:round}
.ring.ok .fg{stroke:var(--accent)}
.ring span{font-size:12px;font-weight:600;color:var(--muted);position:relative}
.ring.ok span{color:var(--accent)}
.name{min-width:0;display:grid;gap:1px}
.name .n1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name .n2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{display:inline-block;font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;background:var(--bg2);color:var(--muted);margin-right:4px;vertical-align:1px}
.spark{width:64px;height:28px;display:block}
.px{display:grid;justify-items:end;gap:3px}
.px .p{font-size:15px;font-weight:500}
.pill{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;min-width:58px;text-align:right}
.pill.up{background:var(--up);color:#fff}.pill.down{background:var(--down);color:#fff}.pill.flat{background:var(--bg2);color:var(--muted)}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:6px;margin:0}
.foot{padding:16px 0 28px;font-size:12px;color:var(--muted)}
.warn{font-size:12px;color:var(--mid);margin:4px 0 0}

/* supply chain */
.meter{display:inline-flex;gap:2px;margin-left:auto}
.meter i{width:8px;height:5px;border-radius:1px;background:var(--line)}
.meter i.f{background:var(--up)}

/* info pages */
.prose{padding:8px 0 24px;display:grid;gap:12px;font-size:14px}
.prose h3{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 0;letter-spacing:.04em}
.prose ul{margin:0;padding-left:1.1em;display:grid;gap:8px}
.kr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-weight:500}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;border-left:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@media (min-width:700px){.grab{display:none}}
.sh-hd{display:flex;align-items:flex-start;gap:10px}
.sh-hd h2{font-size:20px;margin:0;font-weight:700}
.sh-hd .sub{font-size:13px;color:var(--muted)}
.sh-hd .icon{margin-left:auto;margin-top:-2px}
.quote{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px;flex-wrap:wrap}
.quote .big{font-size:32px;font-weight:600;letter-spacing:-.01em}
.quote .chg{font-size:15px;font-weight:600}
.quote .sc{margin-left:auto;font-size:13px;color:var(--muted)}
.quote .sc b{color:var(--ink)}
.badge-ok{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px;margin-left:4px}
.bigspark{width:100%;height:64px;display:block;margin:6px 0 4px}
.sh-sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:18px 0 2px}
.ind{display:grid}
.ir{display:grid;grid-template-columns:1fr auto 40px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ind .k small{display:block;font-size:11.5px;color:var(--muted)}
.ind .v{text-align:right;font-weight:600}
.lv{font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;text-align:center;min-width:26px}
.lv.s{color:var(--strong);background:var(--accent-soft)}
.lv.m{color:var(--mid);background:color-mix(in srgb,var(--mid) 15%,transparent)}
.lv.w{color:var(--weak);background:var(--bg2)}
.lv.na{color:var(--muted)}
.v.s{color:var(--strong)}.v.m{color:var(--mid)}.v.w{color:var(--weak)}.v.na{color:var(--muted);font-weight:400}
.why{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.links a{font-size:13px;padding:7px 12px;border-radius:8px;background:var(--bg2);color:var(--ink)}
.std{width:100%;border-collapse:collapse;font-size:13px}
.std td,.std th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.std th{color:var(--muted);font-weight:500;font-size:12px}
.std td:first-child{font-weight:600;white-space:nowrap}
</style>
</head>
<body>

<header class="top">
  <div class="wrap gut">
    <div class="bar">
      <h1>股市雷達<span class="muted" style="font-weight:400"> · 機器人</span></h1>
      <span class="time" id="stamp"></span>
      <button class="icon" id="refresh" aria-label="更新資料"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="icon" id="infoBtn" aria-label="說明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    </div>
    <div class="ticker" id="ticker"></div>
    <nav class="tabs" role="tablist" aria-label="切換區塊">
      <button role="tab" data-tab="board" aria-selected="true">推薦<span class="n" id="c-board"></span></button>
      <button role="tab" data-tab="mine" aria-selected="false">追蹤<span class="n" id="c-mine"></span></button>
      <button role="tab" data-tab="chain" aria-selected="false">供應鏈</button>
    </nav>
  </div>
</header>

<main class="wrap gut">

<section id="p-board" role="tabpanel">
  <div class="ctrl">
    <div class="filter" role="group" aria-label="市場">
      <button data-mkt="all" aria-pressed="true">全部</button><button data-mkt="tw" aria-pressed="false">台股</button><button data-mkt="gl" aria-pressed="false">外股</button>
    </div>
    <label class="sort">排序
      <select id="sortSel">
        <option value="score">分數</option><option value="chg">漲跌幅</option><option value="rs">RS</option>
        <option value="rev">營收年增</option><option value="trend">趨勢</option><option value="vol">量比</option>
      </select>
    </label>
  </div>
  <p class="warn" id="missing" hidden></p>
  <button class="sec" data-sec="top" aria-expanded="true"><span class="chev">▾</span>達標<span class="cnt" id="topCnt"></span></button>
  <div class="rows" id="boardBody"></div>
  <p class="empty" id="boardEmpty" hidden>目前沒有股票通過全部標準</p>
  <button class="sec" data-sec="pool" aria-expanded="false"><span class="chev">▾</span>候選<span class="cnt" id="poolCnt"></span></button>
  <div class="rows" id="poolBody" hidden></div>
  <p class="foot">左邊圓圈是分數（滿分 14），藍色代表達標。點任一檔看完整指標。</p>
</section>

<section id="p-mine" role="tabpanel" hidden>
  <div id="mineBody"></div>
  <div class="empty" id="mineEmpty" style="padding-top:56px" hidden>
    <b style="color:var(--ink)">還沒有追蹤的個股</b>
    <span>跟 Claude 說「追蹤 上銀」就會加進來</span>
  </div>
  <p class="foot">燈號跟推薦同一套；RS 是拿去跟候選池比。ETF 沒有營收、獲利、上修三燈，圓圈滿分是 8。要再加，跟 Claude 說「追蹤 上銀」。</p>
</section>

<section id="p-chain" role="tabpanel" hidden>
  <div id="segs"></div>
  <p class="foot">紅格＝台廠切入程度（3 格最強）。點區塊名稱展開。</p>
</section>



</main>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shName"></aside>

<script>
var RADAR=/*__RADAR_DATA__*/null;
</script>
<script>
(function(){
var main=document.querySelector('main');
var qk=new URLSearchParams(location.search).get('k'),toastEl=document.getElementById('toast'),tt;
function toast(t,ms){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(tt);if(ms)tt=setTimeout(function(){toastEl.hidden=true},ms)}
var rb=document.getElementById('refresh'),busy=false;
function doRefresh(){
  if(busy)return;busy=true;rb.classList.add('spin');toast('更新中，約 20 秒…');
  fetch('/radar/refresh'+(qk?'?k='+encodeURIComponent(qk):''),{method:'POST'}).then(function(r){return r.json()})
  .then(function(j){if(j.ok){toast('已更新');location.reload()}else{throw 0}})
  .catch(function(){busy=false;rb.classList.remove('spin');toast('更新失敗，稍後再試',3000)});
}
rb.addEventListener('click',doRefresh);
if(!RADAR){main.innerHTML='<div class="empty" style="padding-top:56px"><b style="color:var(--ink)">資料準備中</b><span>伺服器剛重啟，第一次要抓一下</span><button class="filter" style="margin:8px auto 0;padding:8px 16px;border-radius:8px;background:var(--bg2);color:var(--ink)" id="firstLoad">立即更新</button></div>';
  document.getElementById('firstLoad').addEventListener('click',doRefresh);document.getElementById('stamp').textContent='';return}
function f1(x,sign){if(x==null)return '—';var s=(Math.round(x*10)/10).toFixed(1);return (sign&&x>0?'+':'')+s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dir(x){return x==null||x===0?'flat':x>0?'up':'down'}
function money(x){return x==null?'—':x.toLocaleString(undefined,{minimumFractionDigits:x<1000?2:0,maximumFractionDigits:2})}

/* ===== 指標：門檻只寫在這裡 ===== */
var IND=[
  {k:'rev',n:'營收年增',why:'最近月營收 vs 去年同月',s:'≥ 20%',m:'0 ~ 20%',w:'< 0%',
   lv:function(d){var v=d.rev;if(v==null)return null;return v>=20?'s':v>=0?'m':'w'},
   show:function(d){return d.rev==null?(d.m==='gl'?'不適用':'—'):f1(d.rev,1)+'%'}},
  {k:'eps',n:'獲利成長',why:'近四季 EPS 年增',s:'≥ 25%',m:'0 ~ 25%',w:'衰退或虧損',
   lv:function(d){if(d.loss)return 'w';var v=d.eps;if(v==null)return null;return v>=25?'s':v>=0?'m':'w'},
   show:function(d){return d.loss?'虧損':d.eps==null?'—':f1(d.eps,1)+'%'}},
  {k:'est',n:'預估上修',why:'法人 EPS 預估變化',s:'上修 ≥ 5%',m:'±5% 內',w:'下修 ≥ 5%',
   lv:function(d){var v=d.est;if(v==null)return null;if(v==='up')return 's';if(v==='down')return 'w';return v>=5?'s':v>-5?'m':'w'},
   show:function(d){return d.est==='up'?'上修':d.est==='down'?'下修':d.est==null?'—':f1(d.est,1)+'%'}},
  {k:'trend',n:'趨勢',why:'股價高於 200 日線',s:'價 > 50 > 150 > 200 日線，且 200 日線向上',m:'價 > 200 日線',w:'價 < 200 日線',
   lv:function(d){if(d.px==null||d.ma200==null)return null;if(d.px>d.ma50&&d.ma50>d.ma150&&d.ma150>d.ma200&&d.ma200up)return 's';return d.px>d.ma200?'m':'w'},
   show:function(d){return d.px==null||d.ma200==null?'—':f1((d.px/d.ma200-1)*100,1)+'%'}},
  {k:'pos',n:'距 52 週高',why:'越接近新高越強',s:'≤ 10%，且比低點高 ≥ 30%',m:'10 ~ 25%',w:'> 25%',
   lv:function(d){if(d.px==null||d.hi52==null)return null;var off=(1-d.px/d.hi52)*100,up=(d.px/d.lo52-1)*100;if(off<=10&&up>=30)return 's';return off<=25?'m':'w'},
   show:function(d){return d.px==null||d.hi52==null?'—':'−'+f1((1-d.px/d.hi52)*100)+'%'}},
  {k:'rs',n:'相對強度 RS',why:'在候選池的強弱排名 1–99',s:'≥ 80',m:'60 ~ 80',w:'< 60',
   lv:function(d){var v=d.rs;if(v==null)return null;return v>=80?'s':v>=60?'m':'w'},
   show:function(d){return d.rs==null?'—':String(d.rs)}},
  {k:'vol',n:'量比',why:'20 日均量 ÷ 60 日均量',s:'≥ 1.2',m:'1.0 ~ 1.2',w:'< 1.0',
   lv:function(d){var v=d.vol;if(v==null)return null;return v>=1.2?'s':v>=1?'m':'w'},
   show:function(d){return d.vol==null?'—':d.vol.toFixed(2)}}
];
var REG=[{k:'tw',n:'台股'},{k:'us',n:'美股'},{k:'vix',n:'VIX'}];
var SCORE={s:2,m:1,w:0},LVN={s:'強',m:'中',w:'弱'};
var SEG={vision:{no:1,n:'視覺感測',tw:1},brain:{no:2,n:'AI 晶片',tw:1},reducer:{no:3,n:'減速機',tw:2},
  motor:{no:4,n:'馬達驅動',tw:2},screw:{no:5,n:'螺桿滑軌',tw:3},integ:{no:6,n:'整機',tw:1}};
var S=RADAR.stocks,W=RADAR.watch||[],ALL=S.concat(W),NA_ETF=['rev','eps','est'];
ALL.forEach(function(d){
  d.L={};var sc=0,known=0,app=0;
  IND.forEach(function(i){
    if(d.etf&&NA_ETF.indexOf(i.k)>=0){d.L[i.k]='x';return}
    app++;var l=i.lv(d);d.L[i.k]=l;if(l){sc+=SCORE[l];known++}});
  d.score=sc;d.max=app*2;d.complete=known===app;
  d.ok=d.L.trend==='s'&&d.L.pos&&d.L.pos!=='w'&&(d.etf||d.L.rev==='s'||d.L.eps==='s')&&sc/d.max>=9/14;
});
function grp(d){return d.g?SEG[d.g].n:(d.etf?'ETF':'個股')}

/* header */
document.getElementById('stamp').textContent=RADAR.at.slice(5)+' 更新';
document.getElementById('ticker').innerHTML=REG.map(function(g){
  var r=(RADAR.regime||{})[g.k];if(!r||r.px==null)return '<span class="t"><span class="muted">'+g.n+'</span><b>—</b></span>';
  if(g.k==='vix')return '<span class="t"><span class="muted">VIX</span><b>'+r.px.toFixed(1)+'</b><span class="'+(r.px<18?'down':r.px>25?'up':'flat')+'">'+(r.px<18?'平穩':r.px>25?'緊張':'普通')+'</span></span>';
  return '<span class="t"><span class="muted">'+g.n+'</span><b>'+money(r.px)+'</b><span class="'+dir(r.chg)+'">'+f1(r.chg,1)+'%</span></span>';
}).join('');
if(RADAR.missing&&RADAR.missing.length){var mm=document.getElementById('missing');mm.hidden=false;mm.textContent='這次沒抓到：'+RADAR.missing.join('、')}

/* pieces */
function spark(xs,w,h,cls){
  if(!xs||xs.length<2)return '<svg class="'+cls+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"></svg>';
  var lo=Math.min.apply(null,xs),hi=Math.max.apply(null,xs),rg=hi-lo||1,n=xs.length-1;
  var pts=xs.map(function(v,i){return [(i/n*(w-2)+1).toFixed(1),(h-2-(v-lo)/rg*(h-4)).toFixed(1)]});
  var c=xs[n]>=xs[0]?'var(--up)':'var(--down)';
  var d='M'+pts.map(function(p){return p.join(',')}).join('L');
  var area=cls==='bigspark'?'<path d="'+d+'L'+pts[n][0]+','+h+'L'+pts[0][0]+','+h+'Z" fill="'+c+'" opacity=".08"/>':'';
  return '<svg class="'+cls+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+area+'<path d="'+d+'" stroke="'+c+'" fill="none" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
function ring(d){
  var r=15.5,c=2*Math.PI*r,p=Math.min(1,d.score/(d.max||14));
  return '<span class="ring'+(d.ok?' ok':'')+'" title="分數 '+d.score+' / '+(d.max||14)+'"><svg viewBox="0 0 36 36"><circle class="bgc" cx="18" cy="18" r="'+r+'"/><circle class="fg" cx="18" cy="18" r="'+r+'" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'"/></svg><span>'+d.score+'</span></span>';
}
function pill(d){return d.chg==null?'<span class="pill flat">—</span>':'<span class="pill '+dir(d.chg)+'">'+f1(d.chg,1)+'%</span>'}
function row(d,inSeg){
  return '<button class="row" data-c="'+esc(d.c)+'">'+ring(d)+
    '<span class="name"><span class="n1">'+esc(d.n)+'</span><span class="n2"><span class="flag">'+(d.m==='tw'?'台':'外')+'</span>'+esc(d.c)+' · '+(inSeg===true||!d.g?esc(d.role):SEG[d.g].n)+'</span></span>'+
    spark(d.spark,64,28,'spark')+
    '<span class="px"><span class="p">'+money(d.px)+'</span>'+pill(d)+'</span></button>';
}

/* board */
var mkt='all',sortKey='score';
function num(d,k){
  if(k==='score')return d.score;if(k==='chg')return d.chg;if(k==='rev')return d.rev;if(k==='rs')return d.rs;if(k==='vol')return d.vol;
  if(k==='trend')return d.ma200?d.px/d.ma200:null;return null;
}
function cmp(a,b){var x=num(a,sortKey),y=num(b,sortKey);
  if(x==null&&y==null)return b.score-a.score;if(x==null)return 1;if(y==null)return -1;return (y-x)||b.score-a.score||(b.rs||0)-(a.rs||0)}
function rankKey(a,b){return b.score-a.score||(b.rs||0)-(a.rs||0)}
var secTop=document.querySelector('.sec[data-sec=top]'),secPool=document.querySelector('.sec[data-sec=pool]');
function render(){
  var ok=S.filter(function(d){return d.ok}).sort(rankKey);
  var topAll=ok.filter(function(d){return d.m==='tw'}).slice(0,12).concat(ok.filter(function(d){return d.m==='gl'}).slice(0,8));
  var top=topAll.filter(function(d){return mkt==='all'||d.m===mkt}).sort(cmp);
  var pool=S.filter(function(d){return topAll.indexOf(d)<0&&(mkt==='all'||d.m===mkt)}).sort(cmp);
  document.getElementById('c-board').textContent=topAll.length||'';
  document.getElementById('topCnt').textContent=top.length;
  document.getElementById('poolCnt').textContent=pool.length;
  document.getElementById('boardBody').innerHTML=top.map(row).join('');
  document.getElementById('poolBody').innerHTML=pool.map(row).join('');
  document.getElementById('boardEmpty').hidden=top.length>0||secTop.getAttribute('aria-expanded')!=='true';
}
function toggle(b,body,open){b.setAttribute('aria-expanded',open?'true':'false');body.hidden=!open}
document.querySelectorAll('.filter button').forEach(function(b){b.addEventListener('click',function(){
  mkt=b.dataset.mkt;document.querySelectorAll('.filter button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});render()})});
document.getElementById('sortSel').addEventListener('change',function(e){sortKey=e.target.value;render()});
secTop.addEventListener('click',function(){toggle(secTop,document.getElementById('boardBody'),secTop.getAttribute('aria-expanded')!=='true');render()});
secPool.addEventListener('click',function(){toggle(secPool,document.getElementById('poolBody'),secPool.getAttribute('aria-expanded')!=='true')});
render();
if(!document.getElementById('boardBody').children.length)toggle(secPool,document.getElementById('poolBody'),true);

/* 我的追蹤 */
(function(){
  var mine=(RADAR.mine||[]).map(function(c){return ALL.filter(function(d){return d.c===c})[0]}).filter(Boolean);
  document.getElementById('c-mine').textContent=mine.length||'';
  document.getElementById('mineEmpty').hidden=mine.length>0;
  var stocks=mine.filter(function(d){return !d.etf}),etfs=mine.filter(function(d){return d.etf});
  document.getElementById('mineBody').innerHTML=[['個股',stocks],['ETF',etfs]].filter(function(g){return g[1].length}).map(function(g){
    return '<div class="sec" style="cursor:default"><span class="chev" style="visibility:hidden">▾</span>'+g[0]+'<span class="cnt">'+g[1].length+'</span></div><div class="rows">'+g[1].map(row).join('')+'</div>';
  }).join('');
})();

/* supply chain */
var segs=document.getElementById('segs');
segs.innerHTML=Object.keys(SEG).map(function(k){
  var g=SEG[k],items=S.filter(function(d){return d.g===k}).sort(function(a,b){return (a.m==='tw'?0:1)-(b.m==='tw'?0:1)||b.score-a.score});
  return '<div data-seg="'+k+'"><button class="sec" aria-expanded="false"><span class="chev">▾</span>'+g.no+'　'+g.n+'<span class="cnt">'+items.length+'</span><span class="meter" title="台廠切入程度">'+[1,2,3].map(function(n){return '<i class="'+(n<=g.tw?'f':'')+'"></i>'}).join('')+'</span></button>'+
    '<div class="rows" hidden>'+items.map(function(d){return row(d,true)}).join('')+'</div></div>';
}).join('');
segs.querySelectorAll('[data-seg] .sec').forEach(function(b){b.addEventListener('click',function(){
  toggle(b,b.parentNode.querySelector('.rows'),b.getAttribute('aria-expanded')!=='true')})});

/* sheet */
var sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),lastFocus=null;
var X='<button class="icon" aria-label="關閉" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function showSheet(html){
  var was=!sheet.hidden;lastFocus=was?lastFocus:document.activeElement;
  sheet.innerHTML='<div class="grab"></div>'+html;sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;document.body.style.overflow='hidden';
  if(!was)history.pushState({sheet:1},'');
  var x=sheet.querySelector('[data-close]');if(x)x.focus({preventScroll:true});
}
function hideSheet(){sheet.hidden=true;scrim.hidden=true;document.body.style.overflow='';if(lastFocus)lastFocus.focus({preventScroll:true})}
/* 返回鍵／手勢 = 關掉抽屜；X 和背景也走 history.back，跟返回鍵同一條路 */
function closeSheet(){if(sheet.hidden)return;if(history.state&&history.state.sheet)history.back();else hideSheet()}
window.addEventListener('popstate',function(){if(!sheet.hidden)hideSheet()});
function open(c){
  var d=ALL.filter(function(x){return x.c===c})[0];if(!d)return;
  var tech=d.ma200==null?'':'<div class="sh-sec">技術數據</div><div class="kv">'+
    [['50 日線',money(d.ma50)],['150 日線',money(d.ma150)],['200 日線',money(d.ma200)+(d.ma200up?' ↑':' ↓')],['52 週高',money(d.hi52)],['52 週低',money(d.lo52)],['3 個月報酬',d.r3m==null?'—':'<span class="'+dir(d.r3m)+'">'+f1(d.r3m,1)+'%</span>']]
    .map(function(p){return '<div class="kr"><span class="k">'+p[0]+'</span><span class="v">'+p[1]+'</span></div>'}).join('')+'</div>';
  showSheet(
    '<div class="sh-hd"><div><h2 id="shName">'+esc(d.n)+'</h2><div class="sub">'+esc(d.sym||d.c)+' · '+grp(d)+' · '+esc(d.role)+'</div></div>'+X+'</div>'+
    '<div class="quote"><span class="big">'+money(d.px)+'</span><span class="chg '+dir(d.chg)+'">'+(d.chg==null?'':f1(d.chg,1)+'%')+'</span>'+
      '<span class="sc">分數 <b>'+d.score+'</b> / '+d.max+(d.ok?'<span class="badge-ok">達標</span>':'')+'</span></div>'+
    spark(d.spark,300,64,'bigspark')+'<div class="muted" style="font-size:11.5px">近 3 個月</div>'+
    '<div class="sh-sec">指標</div><div class="ind">'+
    IND.map(function(i){var l=d.L[i.k];if(l==='x')return '<div class="ir"><span class="k">'+i.n+'<small>'+i.why+'</small></span><span class="v na">ETF 不適用</span><span class="lv na">—</span></div>';return '<div class="ir"><span class="k">'+i.n+'<small>'+i.why+'</small></span><span class="v '+(l||'na')+'">'+i.show(d)+(i.k==='rev'&&d.revAt?'<small class="muted" style="display:block;font-weight:400;font-size:11px">'+d.revAt+'</small>':'')+'</span><span class="lv '+(l||'na')+'">'+(l?LVN[l]:'—')+'</span></div>'}).join('')+'</div>'+
    tech+
    (d.why&&d.why.length?'<div class="sh-sec">重點</div><ul class="why">'+d.why.map(function(w){return '<li>'+esc(w.t)+(w.u?' <a href="'+esc(w.u)+'" target="_blank" rel="noopener">來源 ↗</a>':'')+'</li>'}).join('')+'</ul>':'')+
    '<div class="links">'+(d.links||[]).map(function(l){return '<a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.t)+' ↗</a>'}).join('')+'</div>');
}
function info(){
  showSheet('<div class="sh-hd"><div><h2 id="shName">說明</h2><div class="sub">每檔 7 個指標，強 2 分 · 中 1 分 · 弱 0 分，滿分 14</div></div>'+X+'</div>'+
    '<table class="std"><thead><tr><th>指標</th><th>強</th><th>中</th><th>弱</th></tr></thead><tbody>'+
    IND.map(function(i){return '<tr><td>'+i.n+'</td><td>'+i.s+'</td><td>'+i.m+'</td><td>'+i.w+'</td></tr>'}).join('')+'</tbody></table>'+
    '<div class="sh-sec">達標條件</div><ul class="why"><li>趨勢＝強，距 52 週高不能是弱</li><li>營收年增或獲利成長至少一個強</li><li>總分 ≥ 9；依分數取前 20，台股 12、外股 8</li></ul>'+
    '<div class="sh-sec">賽道風險</div><ul class="why">'+
    '<li>整機廠多虧損，估值靠預期 <a href="https://www.cnbc.com/2026/08/19/china-backflipping-robot-maker-unitree-jumps-shanghai-ipo.html" target="_blank" rel="noopener">來源 ↗</a></li>'+
    '<li>Optimus 時程一再延後 <a href="https://www.basenor.com/blogs/news/tesla-optimus-production-ramp-6-details-that-matter" target="_blank" rel="noopener">來源 ↗</a></li>'+
    '<li>中國零件便宜 30–40%，壓縮毛利 <a href="https://jpstock-reports.pages.dev/reports/robotics_humanoid_bom_dd_2026-05-16" target="_blank" rel="noopener">來源 ↗</a></li></ul>'+
    '<div class="sh-sec">參考</div><ul class="why">'+
    [['Minervini 趨勢模板','https://www.chartmill.com/documentation/stock-screener/technical-analysis-trading-strategies/496-Mark-Minervini-Trend-Template-A-Step-by-Step-Guide-for-Beginners'],
     ['CANSLIM','https://therighttrader.com/learn/trading-strategies/canslim'],['EPS 上修領先股價','https://www.heygotrade.com/en/blog/earnings-revisions-explained'],
     ['台股三優強勢股','https://money.udn.com/money/story/5607/8939969']].map(function(p){return '<li><a href="'+p[1]+'" target="_blank" rel="noopener">'+p[0]+' ↗</a></li>'}).join('')+'</ul>');
}
document.getElementById('infoBtn').addEventListener('click',info);
scrim.addEventListener('click',closeSheet);
document.addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){closeSheet();return}
  var r=e.target.closest('.row[data-c]');if(r)open(r.dataset.c)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

/* tabs */
var tabs=[].slice.call(document.querySelectorAll('.tabs button')),names=tabs.map(function(b){return b.dataset.tab});
function show(name){if(names.indexOf(name)<0)name='board';
  tabs.forEach(function(b){var on=b.dataset.tab===name;b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;document.getElementById('p-'+b.dataset.tab).hidden=!on});window.scrollTo(0,0)}
tabs.forEach(function(b,i){
  b.addEventListener('click',function(){history.replaceState(history.state,'','#'+b.dataset.tab);show(b.dataset.tab)});
  b.addEventListener('keydown',function(e){var dd=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(!dd)return;var n=tabs[(i+dd+tabs.length)%tabs.length];n.focus();n.click()});
});
show(location.hash.slice(1));
})();
</script>
