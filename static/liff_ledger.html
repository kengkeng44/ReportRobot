<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.2.0/lxgwwenkaitc-bold.css">
<style>
/* 色票取自中國傳統色：靛青、月白、玄青、赤。刻意偏冷 ——
   暖米底 + 襯線是「AI 感」清單第一條。 */
:root {
  --paper: #eef3f6;        /* 月白偏冷 */
  --slip: #ffffff;         /* 收據那張紙 */
  --ink: #1b2329;          /* 玄青 */
  --ink-soft: #5d6b75;
  --rule: #d5dee4;
  --indigo: #177cb0;       /* 靛青：共同 */
  --pine: #2b7a4b;         /* 蒼綠：個人 */
  --cinnabar: #c3272b;     /* 赤：只用在錯誤 */
  --key: #e2e9ee;
  --key-press: #cfd9e0;
  --font-ui: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-display: "LXGW WenKai TC", var(--font-ui);
  --accent: var(--indigo);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1418;
    --slip: #182027;
    --ink: #f5f5f7;        /* 冷白，不用米色 */
    --ink-soft: #9aa7b1;
    --rule: #2a343c;
    --key: #222c34;
    --key-press: #2f3b45;
    --indigo: #4ba3d6;
    --pine: #4fb27a;
  }
}
body[data-kind="個人"] { --accent: var(--pine); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; }
body { min-height: 100dvh; display: flex; flex-direction: column;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 12px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* 帳本切換：左對齊的頁籤，不是置中的大標題 */
.books { display: flex; gap: 18px; align-items: baseline; }
.books button { padding: 4px 0; font-size: 15px; color: var(--ink-soft);
  border-bottom: 2px solid transparent; }
.books button[aria-pressed="true"] { color: var(--ink); font-weight: 600;
  border-bottom-color: var(--ink); }
.books .who { margin-left: auto; font-size: 13px; color: var(--ink-soft); }

/* 收據：品項在左、金額在右，像收銀機的顯示窗 */
.slip { background: var(--slip); border-radius: 14px; padding: 14px 16px 12px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.slip input { grid-column: 1; border: 0; background: none; color: var(--ink);
  font: 600 22px var(--font-display); padding: 0; min-width: 0; outline: none; }
.slip input::placeholder { color: var(--ink-soft); opacity: .6; }
.amount { grid-column: 2; font: 700 40px/1 var(--font-display);
  font-variant-numeric: tabular-nums; color: var(--accent); text-align: right; }
.amount small { font-size: 16px; margin-right: 2px; color: var(--ink-soft); }
.slip .meta { grid-column: 1 / -1; display: flex; align-items: center;
  justify-content: space-between; padding-top: 10px; margin-top: 6px;
  border-top: 1px dashed var(--rule); font-size: 13px; color: var(--ink-soft); }

.split { display: inline-flex; background: var(--key); border-radius: 999px; padding: 3px; }
.split button { padding: 5px 14px; border-radius: 999px; font-size: 14px; color: var(--ink-soft); }
.split button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* 預設鍵：收銀機的商品鍵，按一下直接記好 */
.presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.presets button { background: var(--slip); border-radius: 12px; padding: 10px 12px;
  text-align: left; display: flex; justify-content: space-between; align-items: baseline;
  border: 1px solid var(--rule); }
.presets b { font: 600 16px var(--font-display); }
.presets span { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px; }
.presets button:active { background: var(--key-press); }
.label { font-size: 12px; color: var(--ink-soft); letter-spacing: .08em; margin: 2px 0 -4px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--key);
  font-size: 15px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--slip); }
.chips.amounts button { font-variant-numeric: tabular-nums; }

.pad { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { height: 52px; border-radius: 12px; background: var(--key);
  font: 600 22px var(--font-display); }
.pad button:active { background: var(--key-press); }
.go { height: 56px; border-radius: 14px; background: var(--accent); color: #fff;
  font-size: 18px; font-weight: 600; }
.go:disabled { opacity: .35; }

.toast { font-size: 14px; }
.toast:empty { display: none; }
.toast.err { color: var(--cinnabar); }
.hidden { display: none !important; }
.blank { padding: 40px 0; color: var(--ink-soft); line-height: 1.7; }
</style>
</head>
<body data-kind="共同">

<nav class="books" id="books">
  <button data-mode="couple" aria-pressed="true">共同帳本</button>
  <button data-mode="personal" aria-pressed="false">我的帳</button>
  <span class="who" id="who"></span>
</nav>

<section class="slip">
  <input id="item" placeholder="記什麼？" maxlength="30" autocomplete="off" enterkeyhint="done">
  <div class="amount"><small>NT$</small><span id="amount">0</span></div>
  <div class="meta">
    <span id="splitNote">兩人平分</span>
    <div class="split" id="split">
      <button data-kind="共同" aria-pressed="true">共同</button>
      <button data-kind="個人" aria-pressed="false">個人</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<div class="label" id="presetLabel">常記的，按一下就記好</div>
<div class="presets" id="presets"></div>

<div class="chips" id="items"></div>
<div class="chips amounts" id="amounts"></div>

<div class="pad" id="pad">
  <button>1</button><button>2</button><button>3</button>
  <button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button>
  <button>00</button><button>0</button><button aria-label="刪除">⌫</button>
</div>
<button class="go" id="go" disabled>記下</button>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "__LIFF_ID__";
const $ = (id) => document.getElementById(id);
const state = { mode: "couple", kind: "共同", amount: "", data: null, busy: false };

function fmt(n) { return Number(n).toLocaleString("en-US"); }

function toast(msg, err) {
  const t = $("toast");
  t.textContent = msg || "";
  t.classList.toggle("err", !!err);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: Object.assign({ Authorization: "Bearer " + liff.getIDToken() },
                           body ? { "Content-Type": "application/json" } : {}),
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.message || json.detail || ("HTTP " + res.status));
  return json;
}

function setKind(kind) {
  state.kind = kind;
  document.body.dataset.kind = kind;
  for (const b of $("split").children) b.setAttribute("aria-pressed", b.dataset.kind === kind);
  $("splitNote").textContent = kind === "共同"
    ? (state.mode === "couple" ? "兩人平分，列入結算" : "共同，只記你那半")
    : (state.mode === "couple" ? "自己的，不列入結算" : "自己的");
}

function setMode(mode) {
  state.mode = mode;
  for (const b of $("books").querySelectorAll("button"))
    b.setAttribute("aria-pressed", b.dataset.mode === mode);
  setKind(mode === "couple" ? "共同" : "個人");
  renderSuggestions();
}

function setAmount(v) {
  state.amount = v.replace(/^0+(?=\d)/, "").slice(0, 7);
  $("amount").textContent = state.amount ? fmt(state.amount) : "0";
  refreshGo();
}

function refreshGo() {
  $("go").disabled = state.busy || !$("item").value.trim() || !(Number(state.amount) > 0);
}

function sugg() {
  return (state.data && state.data.suggestions[state.mode]) || { combos: [], items: [], amounts: {} };
}

function renderSuggestions() {
  const s = sugg();
  const presets = $("presets");
  presets.innerHTML = "";
  for (const c of s.combos) {
    const b = document.createElement("button");
    const tail = c.kind === "共同" && state.mode === "personal" ? " 共同"
               : c.kind === "個人" && state.mode === "couple" ? " 個人" : "";
    b.innerHTML = `<b></b><span></span>`;
    b.querySelector("b").textContent = c.item + tail;
    b.querySelector("span").textContent = fmt(c.total);
    b.onclick = () => submit({ item: c.item, amount: c.total, kind: c.kind });
    presets.appendChild(b);
  }
  $("presetLabel").classList.toggle("hidden", !s.combos.length);

  const items = $("items");
  items.innerHTML = "";
  for (const name of s.items) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => { $("item").value = name; renderAmounts(); refreshGo(); };
    items.appendChild(b);
  }
  renderAmounts();
}

function renderAmounts() {
  const name = $("item").value.trim();
  for (const b of $("items").children) b.setAttribute("aria-pressed", b.textContent === name);
  const list = sugg().amounts[name] || [];
  const box = $("amounts");
  box.innerHTML = "";
  for (const a of list) {
    const b = document.createElement("button");
    b.textContent = fmt(a);
    b.onclick = () => setAmount(String(a));
    box.appendChild(b);
  }
  box.classList.toggle("hidden", !list.length);
}

async function submit(entry) {
  if (state.busy) return;
  state.busy = true; refreshGo();
  toast("記帳中…");
  try {
    const r = await api("/liff/api/record", Object.assign({ mode: state.mode }, entry));
    toast(r.message);
    // 在聊天室裡開的就留一句話在聊天室，對方也看得到記了什麼。
    // 結尾刻意是括號：bot 的「午餐 120」解析要求數字或分攤結尾，這句不會被再記一次。
    const ctx = liff.getContext() || {};
    if (["group", "room", "utou"].includes(ctx.type)) {
      const tag = entry.kind === "個人" ? "個人" : "共同";
      liff.sendMessages([{ type: "text", text: `📝 ${entry.item} NT$${fmt(entry.amount)}・${tag}（表單）` }]).catch(() => {});
    }
    $("item").value = ""; setAmount(""); renderAmounts();
  } catch (e) {
    toast(e.message, true);
  } finally {
    state.busy = false; refreshGo();
  }
}

function wire() {
  $("books").onclick = (e) => {
    const m = e.target.dataset && e.target.dataset.mode;
    if (m && state.data && state.data.modes.includes(m)) setMode(m);
  };
  $("split").onclick = (e) => { const k = e.target.dataset.kind; if (k) setKind(k); };
  $("pad").onclick = (e) => {
    if (e.target.tagName !== "BUTTON") return;
    const k = e.target.textContent;
    setAmount(k === "⌫" ? state.amount.slice(0, -1) : state.amount + k);
  };
  $("item").oninput = () => { renderAmounts(); refreshGo(); };
  $("go").onclick = () => submit({ item: $("item").value.trim(), amount: Number(state.amount), kind: state.kind });
}

async function main() {
  wire();
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    state.data = await api("/liff/api/bootstrap");
  } catch (e) {
    document.body.innerHTML = `<p class="blank">表單打不開：${e.message}<br>請從 LINE 裡重新點一次。</p>`;
    return;
  }
  const modes = state.data.modes;
  if (!modes.length) {
    document.body.innerHTML = `<p class="blank">你還沒有記帳權限。<br>要先加入記帳群組才能用這張表單。</p>`;
    return;
  }
  for (const b of $("books").querySelectorAll("button"))
    b.classList.toggle("hidden", !modes.includes(b.dataset.mode));
  try {
    const p = await liff.getProfile();
    $("who").textContent = p.displayName;
  } catch (_) {}
  // 在群組開預設共同帳本，私訊開預設我的帳
  const type = (liff.getContext() || {}).type;
  const prefer = type === "utou" ? "personal" : "couple";
  setMode(modes.includes(prefer) ? prefer : modes[0]);
}
main();
</script>
</body>
</html>
